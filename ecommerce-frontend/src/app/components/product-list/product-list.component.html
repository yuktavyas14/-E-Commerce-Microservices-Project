<div class="product-list-container">
  <div class="header">
    <h1>Products</h1>
    @if (isAdmin()) {
      <button mat-raised-button color="primary" (click)="openProductDialog()">
        <mat-icon>add</mat-icon>
        Add Product
      </button>
    }
  </div>

  @if (loading()) {
    <div class="loading-container">
      <mat-spinner></mat-spinner>
    </div>
  } @else {
    @if (products().length === 0) {
      <div class="no-products">
        <p>No products available</p>
      </div>
    } @else {
      <div class="products-grid">
        @for (product of products(); track product.id) {
          <mat-card class="product-card">
            <mat-card-header>
              <mat-card-title>{{ product.name }}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <div class="price">${{ product.price | number:'1.2-2' }}</div>
            </mat-card-content>
            <mat-card-actions>
              <button mat-raised-button color="accent" (click)="openOrderDialog(product)">
                <mat-icon>shopping_cart</mat-icon>
                Order Now
              </button>
              @if (isAdmin()) {
                <button mat-icon-button color="primary" (click)="openProductDialog(product)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteProduct(product.id!)">
                  <mat-icon>delete</mat-icon>
                </button>
              }
            </mat-card-actions>
          </mat-card>
        }
      </div>
    }
  }
</div>
