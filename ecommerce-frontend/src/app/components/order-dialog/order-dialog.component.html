<h2 mat-dialog-title>Place Order</h2>
<mat-dialog-content>
  <div class="product-info">
    <h3>{{ product.name }}</h3>
    <p class="price">Price: ${{ product.price | number:'1.2-2' }}</p>
  </div>

  <form [formGroup]="orderForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" formControlName="quantity" />
      @if (orderForm.get('quantity')?.hasError('required')) {
        <mat-error>Quantity is required</mat-error>
      }
      @if (orderForm.get('quantity')?.hasError('min')) {
        <mat-error>Quantity must be at least 1</mat-error>
      }
    </mat-form-field>
  </form>

  <div class="total">
    <strong>Total: ${{ totalPrice | number:'1.2-2' }}</strong>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!orderForm.valid || loading()">
    Place Order
  </button>
</mat-dialog-actions>
